# Pulse-HWM CI: tests + style + dependency-audit on every PR and main push.
# Runs on Windows because the test suite exercises Windows-specific paths
# (psutil/pywin32/winotify habits) exactly like a real install.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Test suite (offline)
        run: python -m pytest -q

      - name: Format gate (black)
        run: black --check .

      - name: Lint gate (ruff)
        run: ruff check .

      - name: Known-vulnerability audit of the final env
        run: |
          pip install --upgrade pip-audit
          python -m pip_audit --strict

  # the update channel is security-relevant infrastructure — the worker
  # modules get a syntax + bundle check on every PR too
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax-check every worker module
        shell: bash
        run: |
          for f in $(find workers/src -name '*.js'); do node --check "$f"; done
          echo "all worker modules parse"

      - name: Bundle check (esbuild via wrangler dry-run)
        # must run FROM workers/ so wrangler reads workers/wrangler.jsonc —
        # from the repo root it falls back to static-assets detection and dies
        working-directory: workers
        run: npx --yes wrangler@latest deploy --dry-run --outdir=/tmp/dry
