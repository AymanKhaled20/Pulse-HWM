# Keeps the free-tier Supabase project from auto-pausing (it pauses after
# ~7 days of inactivity — fatal for a beta app used sporadically).
#
# Required repo secrets:
#   SUPABASE_URL       — https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  — the publishable/anon (public) key
#
# A trivial REST SELECT through RLS is still real database activity and
# is enough to reset the idle timer. No service-role key is involved.
name: supabase-keepalive
on:
  schedule:
    - cron: "0 6 */3 * *" # every 3 days, well inside the 7-day window
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (resets free-tier idle timer)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/user_sites?select=user_id&limit=1")
          echo "REST status: ${code}"
          # 200 (empty result) is the healthy path; 401/404 means config broke
          if [ "$code" != "200" ]; then
            echo "::warning::unexpected status ${code} — check Supabase config"
          fi
