# Pulse-HWM pre-commit hooks. Order matters: format first, lint second,
# then the two independent secret scanners run before EVERY commit.
#
# Install once:  pre-commit install   (or: py -m pre_commit install)
# Re-run manually on all files:  pre-commit run --all-files
repos:
  # ── formatting: black is the ONLY formatter. ruff-format is deliberately
  #    not in this pipeline — it disagrees with black on blank lines before
  #    `if __name__` etc., so the two would flip-flop on every commit. ───────
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]

  # ── secrets: custom scanner + gitleaks resolver guard ────────────────────
  - repo: local
    hooks:
      - id: pulse-secret-scan
        name: pulse custom secret scan (staged)
        entry: py scripts/scan_secrets.py --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true

      - id: gitleaks-staged
        name: gitleaks (staged, via resolver guard)
        entry: py scripts/gitleaks_guard.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        always_run: true
